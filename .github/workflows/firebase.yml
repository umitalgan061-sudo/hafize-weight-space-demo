name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firebase credential
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN repository secret is missing. Add a valid Firebase CI token before retrying."
            exit 1
          fi

      - name: Deploy both Hosting sites
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          firebase deploy --project=hafize-23465 --only=hosting --non-interactive --debug 2>&1 | tee /tmp/firebase-deploy.log

      - name: Verify live Hosting sites
        run: |
          set -euo pipefail
          for url in https://hafize-weight-space-demo.web.app/ https://weight-space06.web.app/; do
            response="$(curl --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 --silent --show-error "$url")"
            if printf '%s' "$response" | grep -Fq "Site Not Found"; then
              echo "::error::$url still serves Firebase's placeholder page after deployment."
              exit 1
            fi
            echo "Verified $url"
          done
