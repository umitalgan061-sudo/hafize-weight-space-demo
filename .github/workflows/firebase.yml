name: Deploy to Firebase


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD" ]; then
            credential_file="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD" > "$credential_file"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"
            echo "Using Firebase service-account credentials."
