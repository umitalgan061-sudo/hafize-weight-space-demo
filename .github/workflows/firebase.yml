name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD" ]; then
            credential_file="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD" > "$credential_file"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"
            echo "Using Firebase service-account credentials."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "::warning::Using legacy FIREBASE_TOKEN. Prefer FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD."
          else
            echo "::error::No Firebase credential is configured. Add FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD (recommended) or FIREBASE_TOKEN before retrying."
            exit 1
          fi

      - name: Deploy both Hosting sites
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          firebase deploy --project=projelerim-8fecd --only=hosting --non-interactive --debug 2>&1 | tee /tmp/firebase-deploy.log

      - name: Verify live Hosting sites
        run: |
          set -euo pipefail
          for url in https://hafize-weight-space-demo.web.app/ https://weight-space06.web.app/; do
            response="$(curl --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 --silent --show-error "$url")"
            if printf '%s' "$response" | grep -Fq "Site Not Found"; then
              echo "::error::$url still serves Firebase's placeholder page after deployment."
              exit 1
            fi
            echo "Verified $url"
          done
