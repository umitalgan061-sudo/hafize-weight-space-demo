name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --project=hafize-23465 --only=hosting:hafize-weight-space-demo --token=${{ secrets.FIREBASE_TOKEN }} --non-interactive --debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}