name: Verify live mobile voice
on:
  workflow_dispatch:
  push:
    branches: [verify-live-voice-webkit]
    paths: ['.github/workflows/live-mobile-voice.yml','ops/check-mobile-preview.cjs']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.55.0
      - run: '"$RUNNER_TEMP/pw/node_modules/.bin/playwright-core" install --with-deps webkit'
      - run: LIVE_ONLY=1 NODE_PATH="$RUNNER_TEMP/pw/node_modules" node ops/check-mobile-preview.cjs
