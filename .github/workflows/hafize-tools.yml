name: Publish Hafize frontend tools
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hafize-tools.yml', 'ops/publish-hafize-tools.cjs', 'ops/check-file-analysis.cjs', 'ops/check-camera-voice.cjs']
permissions:
  contents: read
concurrency:
  group: hafize-ua-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: umitalgan061-sudo/hafize
          ref: 7d13759ca33f186654ed327bc9208be8e1cdbcc7
          path: hafize
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: umitalgan061-sudo/hafize
          ref: 5c98ce0eeadaefef0062a76e2fdba2ed93f21338
          path: camera-source
          sparse-checkout: |
            public/typed/live-screen.ts
            public/typed/voice-mode.ts
            public/typed/voice-output.ts
            public/typed/voice-library.ts
            public/typed/supertonic-worker.js
            public/typed/supertonic-pack.ts
            public/typed/voice-settings.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone frontend tools
        run: |
          set -eu
          cp camera-source/public/typed/* hafize/public/typed/
          npm install --prefix camera-source --no-audit --no-fund esbuild@0.25.12 onnxruntime-web@1.20.1
          cd hafize
          mkdir -p ../assets/typed-build
          ../camera-source/node_modules/.bin/esbuild ../camera-source/public/typed/{supertonic-worker.js,voice-output.ts,voice-settings.ts} --bundle --format=esm --target=es2022 --outdir=../assets/typed-build
          ../camera-source/node_modules/.bin/esbuild ../camera-source/public/typed/voice-library.ts --bundle --format=esm --outfile=../voice-test-lib.js
          npm exec --yes --package=esbuild@0.25.12 -- esbuild public/typed/live-screen.ts public/typed/voice-mode.ts public/typed/file-analysis.ts public/typed/analysis-draft.ts public/typed/task-plan.ts public/typed/studio.ts --bundle --format=esm --platform=browser --target=es2022 --outdir=../assets/typed-build
          cp public/voice-mode.css public/file-analysis.html public/task-plan.html public/studio.html public/studio.css ../assets/
      - name: Synthesize Turkish with two downloaded speakers
        run: |
          npm install --prefix "$RUNNER_TEMP/speech-check" playwright-core@1.55.0
          NODE_PATH="$RUNNER_TEMP/speech-check/node_modules" node ops/check-supertonic.cjs
      - run: npm install --global firebase-tools@14
      - name: Publish and verify live site
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJELERIM_8FECD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -eu
          if [[ -n "$SERVICE_ACCOUNT" ]]; then
            umask 077
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-deploy.json"
            trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
            printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
            unset FIREBASE_TOKEN
          fi
          export NODE_PATH="$(npm root --global)"
          node ops/publish-hafize-tools.cjs
      - name: Exercise the live analysis tools in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/hafize-browser" --no-audit --no-fund playwright-core@1.55.0
          NODE_PATH="$RUNNER_TEMP/hafize-browser/node_modules" node ops/check-file-analysis.cjs
          NODE_PATH="$RUNNER_TEMP/hafize-browser/node_modules" node ops/check-camera-voice.cjs
